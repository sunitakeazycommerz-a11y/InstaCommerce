version: 2
updates:
  # Gradle Ecosystem
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  # Go Microservices (consolidated across all 9 Go modules)
  - package-ecosystem: "gomod"
    directories:
      - "/services/go-shared"
      - "/services/cdc-consumer-service"
      - "/services/dispatch-optimizer-service"
      - "/services/location-ingestion-service"
      - "/services/outbox-relay-service"
      - "/services/payment-webhook-service"
      - "/services/reconciliation-engine"
      - "/services/reverse-etl-orchestrator"
      - "/services/stream-processor-service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python Services & Data Platform
  - package-ecosystem: "pip"
    directories:
      - "/services/ai-inference-service"
      - "/services/ai-orchestrator-service"
      - "/ml"
      - "/data-platform-jobs"
      - "/data-platform/airflow"
      - "/data-platform/quality"
      - "/data-platform/streaming"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Playwright End-to-End Suite
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker Container Images (grouped by runtime stack to avoid 30-PR storms)
  - package-ecosystem: "docker"
    directories:
      - "/services/admin-gateway-service"
      - "/services/audit-trail-service"
      - "/services/cart-service"
      - "/services/catalog-service"
      - "/services/checkout-orchestrator-service"
      - "/services/config-feature-flag-service"
      - "/services/fraud-detection-service"
      - "/services/fulfillment-service"
      - "/services/identity-service"
      - "/services/inventory-service"
      - "/services/mobile-bff-service"
      - "/services/notification-service"
      - "/services/order-service"
      - "/services/payment-service"
      - "/services/pricing-service"
      - "/services/rider-fleet-service"
      - "/services/routing-eta-service"
      - "/services/search-service"
      - "/services/wallet-loyalty-service"
      - "/services/warehouse-service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-java-services:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/services/cdc-consumer-service"
      - "/services/dispatch-optimizer-service"
      - "/services/location-ingestion-service"
      - "/services/outbox-relay-service"
      - "/services/payment-webhook-service"
      - "/services/reconciliation-engine"
      - "/services/reverse-etl-orchestrator"
      - "/services/stream-processor-service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-go-services:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/services/ai-inference-service"
      - "/services/ai-orchestrator-service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker-python-services:
        patterns:
          - "*"
