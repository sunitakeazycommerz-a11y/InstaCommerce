apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: checkout-pod-kill-experiment
  namespace: instacommerce-staging
  labels:
    app.kubernetes.io/part-of: instacommerce-chaos-suite
spec:
  action: pod-kill
  mode: fixed
  value: "1"
  selector:
    namespaces:
      - instacommerce-staging
    labelSelectors:
      app: checkout-orchestrator-service
  scheduler:
    cron: "@weekly"
  duration: "30s"
