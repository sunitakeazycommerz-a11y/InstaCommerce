apiVersion: v1
kind: Secret
metadata:
  name: reverse-etl-db-credentials
  namespace: reverse-etl
type: Opaque
stringData:
  url: "postgres://etl_user:${DB_PASSWORD}@pg-primary.postgres.svc.cluster.local:5432/reverse_etl?sslmode=require&connect_timeout=10"

---
apiVersion: v1
kind: Secret
metadata:
  name: reverse-etl-warehouse-credentials
  namespace: reverse-etl
type: Opaque
stringData:
  username: "${WAREHOUSE_USER}"
  password: "${WAREHOUSE_PASSWORD}"

---
apiVersion: v1
kind: Secret
metadata:
  name: reverse-etl-marketing-credentials
  namespace: reverse-etl
type: Opaque
stringData:
  api_key: "${SEGMENT_API_KEY}"

---
apiVersion: v1
kind: Secret
metadata:
  name: reverse-etl-analytics-credentials
  namespace: reverse-etl
type: Opaque
stringData:
  hosts: "es-node1.elasticsearch.svc.cluster.local:9200,es-node2.elasticsearch.svc.cluster.local:9200,es-node3.elasticsearch.svc.cluster.local:9200"
  username: "${ES_USERNAME}"
  password: "${ES_PASSWORD}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-etl-warehouse-config
  namespace: reverse-etl
data:
  type: "snowflake"
  account: "${SNOWFLAKE_ACCOUNT}"
  database: "reverse_etl_prod"
  warehouse: "etl_compute"
  role: "etl_role"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-etl-marketing-config
  namespace: reverse-etl
data:
  platform: "segment"
  workspace_slug: "instacommerce-prod"
  data_residency: "US"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-etl-analytics-config
  namespace: reverse-etl
data:
  index_prefix: "reverse-etl"
  index_pattern: "reverse-etl-*"
  number_of_shards: "3"
  number_of_replicas: "2"
