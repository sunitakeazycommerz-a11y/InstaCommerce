name: instacommerce_analytics
version: '1.0.0'
config-version: 2
profile: instacommerce
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  parquet_compression_codec: zstd
  parquet_compression_level: 3

models:
  instacommerce_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      mart_daily_revenue:
        +partition_by:
          field: order_date
          data_type: date
      mart_rider_performance:
        +partition_by:
          field: order_date
          data_type: date
      mart_store_performance:
        +partition_by:
          field: order_date
          data_type: date
      mart_order_fulfillment:
        +materialized: incremental
        +unique_key: order_id
        +partition_by:
          field: order_date
          data_type: date
        +cluster_by: ["store_id", "status"]
      mart_daily_sales:
        +materialized: table
        +partition_by:
          field: sale_date
          data_type: date
        +cluster_by: ["store_id"]
