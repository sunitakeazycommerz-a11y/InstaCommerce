# Great Expectations validation suite for mart_daily_sales
#
# Validates daily financial sales metrics in BigQuery.
# Run via: python run_quality_checks.py --suite daily_sales

expectation_suite:
  name: daily_sales_validation
  expectations:
    - expectation_type: expect_column_values_to_not_be_null
      kwargs:
        column: sale_date
    - expectation_type: expect_column_values_to_not_be_null
      kwargs:
        column: store_id
    - expectation_type: expect_column_values_to_be_between
      kwargs:
        column: total_revenue_usd
        min_value: 0.01
        max_value: 10000000.0
    - expectation_type: expect_column_values_to_be_between
      kwargs:
        column: order_count
        min_value: 0
        max_value: 1000000
    - expectation_type: expect_column_values_to_be_between
      kwargs:
        column: on_time_pct
        min_value: 0.0
        max_value: 100.0
