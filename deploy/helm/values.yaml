global:
  gcpProject: "instacommerce-prod"
  image:
    registry: asia-south1-docker.pkg.dev/instacommerce/images
    pullPolicy: IfNotPresent

pdb:
  enabled: true
  maxUnavailable: 1

ingress:
  enabled: false

istio:
  enabled: true
  gateway:
    name: instacommerce-gateway
    hosts:
      - api.instacommerce.dev
      - m.instacommerce.dev
      - admin.instacommerce.dev
    tlsSecret: instacommerce-tls
  virtualService:
    name: api-routing
    hosts:
      - api.instacommerce.dev
      - m.instacommerce.dev
      - admin.instacommerce.dev
  routes:
    - prefix: /api/v1/auth
      service: identity-service
    - prefix: /api/v1/users
      service: identity-service
    - prefix: /api/v1/products
      service: catalog-service
    - prefix: /api/v1/categories
      service: catalog-service
    - prefix: /api/v1/search
      service: search-service
    - prefix: /api/v1/pricing
      service: pricing-service
    - prefix: /api/v1/cart
      service: cart-service
    - prefix: /api/v1/checkout
      service: checkout-orchestrator-service
    - prefix: /api/v1/orders
      service: order-service
    - prefix: /api/v1/fulfillment
      service: fulfillment-service
    - prefix: /api/v1/stores
      service: warehouse-service
    - prefix: /api/v1/riders
      service: rider-fleet-service
    - prefix: /api/v1/deliveries
      service: routing-eta-service
    - prefix: /api/v1/tracking
      service: routing-eta-service
    - prefix: /api/v1/notifications
      service: notification-service
    - prefix: /api/v1/wallet
      service: wallet-loyalty-service
    - prefix: /api/v1/loyalty
      service: wallet-loyalty-service
    - prefix: /api/v1/referral
      service: wallet-loyalty-service
    - prefix: /api/v1/fraud
      service: fraud-detection-service
    - prefix: /api/v1/flags
      service: config-feature-flag-service
    - prefix: /api/v1/audit
      service: audit-trail-service
    - prefix: /bff/mobile/v1
      service: mobile-bff-service
    - prefix: /m/v1
      service: mobile-bff-service
    - prefix: /admin/v1
      service: admin-gateway-service
  requestAuthentications:
    - name: payment-service-jwt
      selector:
        app: payment-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
    - name: order-service-jwt
      selector:
        app: order-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
    - name: checkout-orchestrator-service-jwt
      selector:
        app: checkout-orchestrator-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
    - name: inventory-service-jwt
      selector:
        app: inventory-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
    - name: ingress-gateway-jwt
      selector:
        istio: ingressgateway
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
          forwardOriginalToken: true
    - name: mobile-bff-service-jwt
      selector:
        app: mobile-bff-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
          forwardOriginalToken: true
    - name: admin-gateway-service-jwt
      selector:
        app: admin-gateway-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
          audiences: ["instacommerce-admin"]
          forwardOriginalToken: true
  authorizationPolicies:
    - name: ingress-admin-host-isolation
      selector:
        istio: ingressgateway
      action: DENY
      rules:
        - from:
            - source:
                notRequestPrincipals: ["instacommerce-identity/*"]
          to:
            - operation:
                hosts: ["admin.instacommerce.dev"]
        - to:
            - operation:
                hosts: ["admin.instacommerce.dev"]
          when:
            - key: request.auth.claims[aud]
              notValues: ["instacommerce-admin"]
    - name: admin-gateway-rbac-policy
      selector:
        app: admin-gateway-service
      action: ALLOW
      rules:
        - from:
            - source:
                requestPrincipals: ["instacommerce-identity/*"]
          when:
            - key: request.auth.claims[aud]
              values: ["instacommerce-admin"]
    - name: mobile-bff-access-policy
      selector:
        app: mobile-bff-service
      action: ALLOW
      rules:
        - to:
            - operation:
                paths: ["/actuator/health/*", "/actuator/prometheus", "/api/v1/catalog/*", "/api/v1/products/*", "/api/v1/categories/*"]
        - from:
            - source:
                requestPrincipals: ["instacommerce-identity/*"]
          when:
            - key: request.auth.claims[iss]
              values: ["instacommerce-identity"]
    - name: payment-service-internal
      selector:
        app: payment-service
      principals:
        - cluster.local/ns/{{ .Release.Namespace }}/sa/order-service
        - cluster.local/ns/{{ .Release.Namespace }}/sa/fulfillment-service
    - name: inventory-service-internal
      selector:
        app: inventory-service
      principals:
        - cluster.local/ns/{{ .Release.Namespace }}/sa/order-service
        - cluster.local/ns/{{ .Release.Namespace }}/sa/fulfillment-service
    - name: admin-gateway-deny-unauthenticated
      selector:
        app: admin-gateway-service
      action: DENY
      notPrincipals:
        - "*"
  denyDefault:
    enabled: true
  servicePolicies:
    identity-service:
      allowFrom:
        - istio-ingressgateway
        - mobile-bff-service
        - admin-gateway-service
        - checkout-orchestrator-service
        - order-service
        - fulfillment-service
        - notification-service
        - ai-orchestrator-service
    checkout-orchestrator-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - order-service
        - ai-orchestrator-service
    order-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - checkout-orchestrator-service
        - fulfillment-service
        - notification-service
        - wallet-loyalty-service
        - fraud-detection-service
        - ai-orchestrator-service
        - payment-webhook
        - reconciliation-engine
    payment-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - checkout-orchestrator-service
        - fulfillment-service
        - order-service
        - ai-orchestrator-service
        - payment-webhook
        - reconciliation-engine
    inventory-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - order-service
        - fulfillment-service
        - checkout-orchestrator-service
        - search-service
        - ai-orchestrator-service
        - warehouse-service
    cart-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - checkout-orchestrator-service
        - order-service
        - ai-orchestrator-service
    pricing-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - cart-service
        - order-service
        - checkout-orchestrator-service
        - ai-orchestrator-service
        - search-service
    catalog-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - search-service
        - cart-service
        - pricing-service
        - order-service
        - checkout-orchestrator-service
        - fulfillment-service
        - ai-orchestrator-service
    search-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - catalog-service
        - ai-orchestrator-service
    fulfillment-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - checkout-orchestrator-service
        - order-service
        - rider-fleet-service
        - routing-eta-service
        - warehouse-service
        - ai-orchestrator-service
    rider-fleet-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - fulfillment-service
        - dispatch-optimizer-service
        - routing-eta-service
        - location-ingestion
        - order-service
    warehouse-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - fulfillment-service
        - inventory-service
        - order-service
        - rider-fleet-service
        - routing-eta-service
    notification-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - order-service
        - payment-service
        - fulfillment-service
        - identity-service
        - rider-fleet-service
        - routing-eta-service
        - wallet-loyalty-service
        - fraud-detection-service
    wallet-loyalty-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - order-service
        - checkout-orchestrator-service
        - payment-service
        - payment-webhook
        - ai-orchestrator-service
    fraud-detection-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - checkout-orchestrator-service
        - payment-service
        - order-service
        - ai-orchestrator-service
    ai-orchestrator-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
    ai-inference-service:
      allowFrom:
        - ai-orchestrator-service
        - routing-eta-service
        - fraud-detection-service
        - search-service
        - pricing-service
        - admin-gateway-service
    config-feature-flag-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - checkout-orchestrator-service
        - fulfillment-service
        - rider-fleet-service
        - routing-eta-service
        - fraud-detection-service
        - pricing-service
        - order-service
        - payment-service
        - ai-orchestrator-service
    audit-trail-service:
      allowFrom:
        - admin-gateway-service
        - identity-service
        - order-service
        - payment-service
        - fulfillment-service
        - wallet-loyalty-service
        - fraud-detection-service
        - config-feature-flag-service
        - payment-webhook
        - reconciliation-engine
    routing-eta-service:
      allowFrom:
        - mobile-bff-service
        - admin-gateway-service
        - fulfillment-service
        - rider-fleet-service
        - order-service
        - dispatch-optimizer-service
        - location-ingestion
    mobile-bff-service:
      allowFrom:
        - istio-ingressgateway
        - admin-gateway-service
    admin-gateway-service:
      allowFrom:
        - istio-ingressgateway
    outbox-relay:
      allowFrom:
        - admin-gateway-service
        - order-service
        - payment-service
        - inventory-service
        - fulfillment-service
    outbox-relay-order:
      allowFrom:
        - admin-gateway-service
        - order-service
    outbox-relay-payment:
      allowFrom:
        - admin-gateway-service
        - payment-service
    outbox-relay-inventory:
      allowFrom:
        - admin-gateway-service
        - inventory-service
    outbox-relay-fulfillment:
      allowFrom:
        - admin-gateway-service
        - fulfillment-service
    outbox-relay-catalog:
      allowFrom:
        - admin-gateway-service
        - catalog-service
    outbox-relay-identity:
      allowFrom:
        - admin-gateway-service
        - identity-service
    outbox-relay-cart:
      allowFrom:
        - admin-gateway-service
        - cart-service
    outbox-relay-pricing:
      allowFrom:
        - admin-gateway-service
        - pricing-service
    outbox-relay-warehouse:
      allowFrom:
        - admin-gateway-service
        - warehouse-service
    outbox-relay-rider-fleet:
      allowFrom:
        - admin-gateway-service
        - rider-fleet-service
    outbox-relay-wallet-loyalty:
      allowFrom:
        - admin-gateway-service
        - wallet-loyalty-service
    outbox-relay-fraud-detection:
      allowFrom:
        - admin-gateway-service
        - fraud-detection-service
    outbox-relay-routing-eta:
      allowFrom:
        - admin-gateway-service
        - routing-eta-service
    payment-webhook:
      allowFrom:
        - istio-ingressgateway
        - admin-gateway-service
        - payment-service
    reconciliation-engine:
      allowFrom:
        - admin-gateway-service
        - payment-service
        - order-service
        - payment-webhook
    dispatch-optimizer-service:
      allowFrom:
        - fulfillment-service
        - rider-fleet-service
        - routing-eta-service
        - admin-gateway-service
    location-ingestion:
      allowFrom:
        - istio-ingressgateway
        - mobile-bff-service
        - rider-fleet-service
        - routing-eta-service
        - admin-gateway-service
    cdc-consumer:
      allowFrom:
        - admin-gateway-service
        - order-service
        - payment-service
        - inventory-service
    stream-processor:
      allowFrom:
        - admin-gateway-service
        - location-ingestion
        - routing-eta-service
        - rider-fleet-service
    reverse-etl-orchestrator:
      allowFrom:
        - admin-gateway-service
        - ai-orchestrator-service

vpa:
  enabled: true

services:
  identity-service:
    replicas: 2
    image: identity-service
    port: 8081
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits: { cpu: 1000m, memory: 1536Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///identity_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
      # Per-service tokens for Wave 34 Track B - injected from service-tokens secret
      IDENTITY_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: identity-service-token
      CATALOG_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: catalog-service-token
      INVENTORY_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: inventory-service-token
      ORDER_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: order-service-token
      PAYMENT_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: payment-service-token
      FULFILLMENT_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: fulfillment-service-token
      NOTIFICATION_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: notification-service-token
      SEARCH_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: search-service-token
      PRICING_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: pricing-service-token
      CART_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: cart-service-token
      CHECKOUT_ORCHESTRATOR_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: checkout-orchestrator-service-token
      WAREHOUSE_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: warehouse-service-token
      RIDER_FLEET_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: rider-fleet-service-token
      ROUTING_ETA_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: routing-eta-service-token
      WALLET_LOYALTY_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: wallet-loyalty-service-token
      AUDIT_TRAIL_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: audit-trail-service-token
      FRAUD_DETECTION_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: fraud-detection-service-token
      CONFIG_FEATURE_FLAG_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: config-feature-flag-service-token
      MOBILE_BFF_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: mobile-bff-service-token
      ADMIN_GATEWAY_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: admin-gateway-service-token
      CDC_CONSUMER_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: cdc-consumer-service-token
      DISPATCH_OPTIMIZER_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: dispatch-optimizer-service-token
      LOCATION_INGESTION_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: location-ingestion-service-token
      OUTBOX_RELAY_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: outbox-relay-service-token
      PAYMENT_WEBHOOK_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: payment-webhook-service-token
      RECONCILIATION_ENGINE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: reconciliation-engine-token
      STREAM_PROCESSOR_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: stream-processor-service-token
      AI_ORCHESTRATOR_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: ai-orchestrator-service-token
      AI_INFERENCE_SERVICE_TOKEN:
        secretKeyRef:
          name: service-tokens
          key: ai-inference-service-token
    hpa:
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70

  catalog-service:
    replicas: 2
    image: catalog-service
    port: 8082
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { cpu: 500m, memory: 768Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///catalog_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    hpa:
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70

  inventory-service:
    replicas: 2
    image: inventory-service
    port: 8083
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1024Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///inventory_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    hpa:
      minReplicas: 2
      maxReplicas: 6
      targetCPU: 70

  order-service:
    replicas: 2
    image: order-service
    port: 8084
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits: { cpu: 1000m, memory: 1536Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///order_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
      ORDER_CHECKOUT_DIRECT_SAGA_ENABLED: "true"
      ORDER_CHOREOGRAPHY_FULFILLMENT_CONSUMER_ENABLED: "false"
      INVENTORY_SERVICE_URL: "http://inventory-service:8083"
      CART_SERVICE_URL: "http://cart-service:8090"
      PAYMENT_SERVICE_URL: "http://payment-service:8085"
      PRICING_SERVICE_URL: "http://pricing-service:8089"
    hpa:
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70

  payment-service:
    replicas: 2
    image: payment-service
    port: 8085
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits: { cpu: 1000m, memory: 1536Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///payment_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
      PAYMENT_CHOREOGRAPHY_ORDER_CANCELLED_CONSUMER_ENABLED: "false"
      PAYMENT_CHOREOGRAPHY_ORDER_CANCELLED_TOPIC: "orders.events"
      PAYMENT_CHOREOGRAPHY_ORDER_CANCELLED_CONSUMER_GROUP: "payment-service-order-cancelled"
      PAYMENT_WEBHOOK_REFUND_OUTBOX_ENABLED: "false"
      PAYMENT_STALE_PENDING_RECOVERY_ENABLED: "false"
      PAYMENT_STALE_PENDING_RECOVERY_CRON: "0 */5 * * * *"
      PAYMENT_STALE_PENDING_RECOVERY_THRESHOLD_MINUTES: "30"
      PAYMENT_STALE_PENDING_RECOVERY_BATCH_SIZE: "50"
    hpa:
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70

  fulfillment-service:
    replicas: 2
    image: fulfillment-service
    port: 8086
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1024Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///fulfillment_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
      FULFILLMENT_CHOREOGRAPHY_ORDER_STATUS_CALLBACK_ENABLED: "true"
      ORDER_SERVICE_URL: "http://order-service:8084"
      PAYMENT_SERVICE_URL: "http://payment-service:8085"
      INVENTORY_SERVICE_URL: "http://inventory-service:8083"
      WAREHOUSE_SERVICE_URL: "http://warehouse-service:8092"
    hpa:
      minReplicas: 2
      maxReplicas: 5
      targetCPU: 70

  notification-service:
    replicas: 2
    image: notification-service
    port: 8087
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 400m, memory: 512Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///notification_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      ORDER_SERVICE_URL: "http://order-service:8084"
    hpa:
      minReplicas: 2
      maxReplicas: 5
      targetCPU: 70

  search-service:
    replicas: 2
    image: search-service
    port: 8088
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1024Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///search_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
      SPRING_DATA_REDIS_HOST: instacommerce-redis-dev.redis.cache.goog
      SPRING_DATA_REDIS_PORT: "6379"
    hpa:
      minReplicas: 2
      maxReplicas: 15
      targetCPU: 70

  pricing-service:
    replicas: 2
    image: pricing-service
    port: 8089
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1024Mi }
    env:
      SPRING_PROFILES_ACTIVE: gcp
      SERVER_PORT: "8089"
      SPRING_DATASOURCE_URL: jdbc:postgresql:///pricing_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
