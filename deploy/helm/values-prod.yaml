global:
  gcpProject: "instacommerce-prod"
  image:
    registry: asia-south1-docker.pkg.dev/instacommerce/images

services:
  identity-service:
    replicas: 3
    tag: prod
  catalog-service:
    replicas: 3
    tag: prod
  inventory-service:
    replicas: 3
    tag: prod
  order-service:
    replicas: 3
    tag: prod
    env:
      ORDER_CHECKOUT_DIRECT_SAGA_ENABLED: "false"
      ORDER_CHOREOGRAPHY_FULFILLMENT_CONSUMER_ENABLED: "false"
  payment-service:
    replicas: 3
    tag: prod
    env:
      PAYMENT_CHOREOGRAPHY_ORDER_CANCELLED_CONSUMER_ENABLED: "false"
      PAYMENT_WEBHOOK_REFUND_OUTBOX_ENABLED: "false"
      PAYMENT_STALE_PENDING_RECOVERY_ENABLED: "false"
  fulfillment-service:
    replicas: 3
    tag: prod
  notification-service:
    replicas: 2
    tag: prod
  search-service:
    replicas: 2
    tag: prod
    env:
      SPRING_DATA_REDIS_HOST: instacommerce-redis-prod.redis.cache.goog
      SPRING_DATA_REDIS_PORT: "6379"
  pricing-service:
    replicas: 2
    tag: prod
    env:
      SPRING_DATA_REDIS_HOST: instacommerce-redis-prod.redis.cache.goog
      SPRING_DATA_REDIS_PORT: "6379"
  cart-service:
    replicas: 2
    tag: prod
    env:
      SPRING_DATA_REDIS_HOST: instacommerce-redis-prod.redis.cache.goog
      SPRING_DATA_REDIS_PORT: "6379"
  checkout-orchestrator-service:
    replicas: 2
    tag: prod
  ai-orchestrator-service:
    replicas: 2
    tag: prod
  ai-inference-service:
    replicas: 2
    tag: prod
  dispatch-optimizer-service:
    replicas: 2
    tag: prod
  outbox-relay:
    replicas: 2
    tag: prod
  cdc-consumer:
    replicas: 2
    tag: prod
  location-ingestion:
    replicas: 2
    tag: prod
  payment-webhook:
    replicas: 2
    tag: prod
  reconciliation-engine:
    replicas: 2
    tag: prod
  warehouse-service:
    replicas: 2
    tag: prod
  rider-fleet-service:
    replicas: 2
    tag: prod
    env:
      SPRING_DATA_REDIS_HOST: instacommerce-redis-prod.redis.cache.goog
      SPRING_DATA_REDIS_PORT: "6379"
  routing-eta-service:
    replicas: 2
    tag: prod
  wallet-loyalty-service:
    replicas: 2
    tag: prod
    env:
      WALLET_CONSUMER_PAYMENT_REFUND_ENABLED: "false"
  audit-trail-service:
    replicas: 2
    tag: prod
  fraud-detection-service:
    replicas: 2
    tag: prod
  config-feature-flag-service:
    replicas: 2
    tag: prod
    env:
      SPRING_DATA_REDIS_HOST: instacommerce-redis-prod.redis.cache.goog
      SPRING_DATA_REDIS_PORT: "6379"
  mobile-bff-service:
    replicas: 2
    tag: prod
  admin-gateway-service:
    replicas: 2
    tag: prod
  stream-processor:
    replicas: 2
    tag: prod
  reverse-etl-orchestrator:
    replicas: 2
    tag: prod

istio:
  enabled: true
  gateway:
    hosts:
      - api.instacommerce.com
      - m.instacommerce.com
      - admin.instacommerce.com
  requestAuthentications:
    - name: ingress-gateway-jwt-prod
      selector:
        istio: ingressgateway
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
          forwardOriginalToken: true
    - name: mobile-bff-service-jwt-prod
      selector:
        app: mobile-bff-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
          forwardOriginalToken: true
    - name: admin-gateway-service-jwt-prod
      selector:
        app: admin-gateway-service
      jwtRules:
        - issuer: instacommerce-identity
          jwksUri: http://identity-service.{{ .Release.Namespace }}.svc.cluster.local:8081/.well-known/jwks.json
          audiences: ["instacommerce-admin"]
          forwardOriginalToken: true
  authorizationPolicies:
    - name: ingress-admin-host-isolation-prod
      selector:
        istio: ingressgateway
      action: DENY
      rules:
        - from:
            - source:
                notRequestPrincipals: ["instacommerce-identity/*"]
          to:
            - operation:
                hosts: ["admin.instacommerce.com"]
        - to:
            - operation:
                hosts: ["admin.instacommerce.com"]
          when:
            - key: request.auth.claims[aud]
              notValues: ["instacommerce-admin"]
    - name: admin-gateway-rbac-policy-prod
      selector:
        app: admin-gateway-service
      action: ALLOW
      rules:
        - from:
            - source:
                requestPrincipals: ["instacommerce-identity/*"]
          when:
            - key: request.auth.claims[aud]
              values: ["instacommerce-admin"]
    - name: mobile-bff-access-policy-prod
      selector:
        app: mobile-bff-service
      action: ALLOW
      rules:
        - to:
            - operation:
                paths: ["/actuator/health/*", "/actuator/prometheus", "/api/v1/catalog/*", "/api/v1/products/*", "/api/v1/categories/*"]
        - from:
            - source:
                requestPrincipals: ["instacommerce-identity/*"]
          when:
            - key: request.auth.claims[iss]
              values: ["instacommerce-identity"]

