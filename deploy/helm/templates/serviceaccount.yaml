{{- range $name, $svc := .Values.services }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    {{- if $.Values.global.gcpProject }}
    iam.gke.io/gcp-service-account: {{ $name }}@{{ $.Values.global.gcpProject }}.iam.gserviceaccount.com
    {{- end }}
    {{- if $svc.serviceAccountAnnotations }}
    {{- toYaml $svc.serviceAccountAnnotations | nindent 4 }}
    {{- end }}
---
{{- end }}
