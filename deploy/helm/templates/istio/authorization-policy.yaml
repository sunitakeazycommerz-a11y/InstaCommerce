{{- if .Values.istio.authorizationPolicies }}
{{- range .Values.istio.authorizationPolicies }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .name }}
spec:
  selector:
    matchLabels:
      {{- if .selector.istio }}
      istio: {{ .selector.istio }}
      {{- else if .selector.app }}
      app: {{ .selector.app }}
      {{- else }}
      {{- toYaml .selector | nindent 6 }}
      {{- end }}
  action: {{ .action | default "ALLOW" }}
  {{- if .rules }}
  rules:
    {{- toYaml .rules | nindent 4 }}
  {{- else if .principals }}
  rules:
    - from:
        - source:
            principals:
              {{- range .principals }}
              - {{ tpl . $ | quote }}
              {{- end }}
  {{- end }}
---
{{- end }}
{{- end }}
