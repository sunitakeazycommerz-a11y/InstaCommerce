{{- if .Values.networkPolicy.enabled }}
{{- range $name, $policy := .Values.istio.servicePolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-ingress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $name }}
  policyTypes:
    - Ingress
  ingress:
    {{- range $policy.allowFrom }}
    {{- if eq . "istio-ingressgateway" }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istio-ingressgateway
        - podSelector:
            matchLabels:
              app: {{ . }}
      ports:
        - port: http
          protocol: TCP
    {{- else }}
    - from:
        - podSelector:
            matchLabels:
              app: {{ . }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- end }}
    # Allow Prometheus scraping only from monitoring namespace/pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: metrics
          protocol: TCP
{{- end }}
---
# Default deny for pods not covered by specific policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}
