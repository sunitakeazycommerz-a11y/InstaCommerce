# Prometheus configuration for InstaCommerce monitoring stack
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - prometheus-rules.yaml

scrape_configs:
  - job_name: 'blackbox-http'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://cart-service:8090/actuator/health/readiness
          - http://order-service:8084/actuator/health/readiness
          - http://inventory-service:8083/actuator/health/readiness
          - http://payment-service:8085/actuator/health/readiness
          - http://pricing-service:8089/actuator/health/readiness
          - http://catalog-service:8082/actuator/health/readiness
          - http://routing-eta-service:8094/actuator/health/readiness
          - http://dispatch-optimizer-service:8102/health
          - http://ai-inference-service:8101/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-grpc'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [grpc_health]
    static_configs:
      # All current services expose HTTP/REST health endpoints probed by blackbox-http.
      # Add host:port targets here only for services implementing grpc.health.v1.Health.
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
