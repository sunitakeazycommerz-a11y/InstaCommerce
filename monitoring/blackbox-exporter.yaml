# Blackbox Exporter configuration for InstaCommerce
# Probes HTTP/1.1, HTTP/2, and gRPC endpoints across services.

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 202, 204]
      method: GET
      fail_if_ssl_error: true
      preferred_ip_protocol: "ip4"

  grpc_health:
    prober: grpc
    timeout: 5s
    grpc:
      service: ""  # Empty string probes overall server health via grpc.health.v1.Health/Check
      preferred_ip_protocol: "ip4"
