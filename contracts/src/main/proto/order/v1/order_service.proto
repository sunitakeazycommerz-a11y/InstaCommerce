syntax = "proto3";
package order.v1;

option java_package = "com.instacommerce.contracts.order.v1";
option java_multiple_files = true;
option go_package = "github.com/instacommerce/go-shared/pkg/proto/order/v1;orderv1";

import "common/v1/money.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  common.v1.Money unit_price = 3;
  common.v1.Money total_price = 4;
}

message CreateOrderRequest {
  string idempotency_key = 1;
  string user_id = 2;
  string store_id = 3;
  repeated OrderItem items = 4;
  common.v1.Money subtotal = 5;
  common.v1.Money discount = 6;
  common.v1.Money delivery_fee = 7;
  common.v1.Money total = 8;
  string coupon_code = 9;
  string reservation_id = 10;
  string payment_id = 11;
  string delivery_address_id = 12;
  string payment_method_id = 13;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
  int32 estimated_delivery_minutes = 3;
}

message GetOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message GetOrderResponse {
  string order_id = 1;
  string user_id = 2;
  string store_id = 3;
  string status = 4;
  repeated OrderItem items = 5;
  common.v1.Money total = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  string status = 2;
  string reason = 3;
}

message UpdateOrderStatusResponse {
  string order_id = 1;
  string status = 2;
  bool updated = 3;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
}

message CancelOrderResponse {
  string order_id = 1;
  bool cancelled = 2;
}
