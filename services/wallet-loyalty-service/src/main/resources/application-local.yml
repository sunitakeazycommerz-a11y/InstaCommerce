spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
        jdbc:
          enabled: false
  datasource:
    password: ${WALLET_DB_PASSWORD:devpass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

wallet:
  consumer:
    payment-refund-enabled: ${WALLET_CONSUMER_PAYMENT_REFUND_ENABLED:true}
  jwt:
    public-key: ${WALLET_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.0}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
