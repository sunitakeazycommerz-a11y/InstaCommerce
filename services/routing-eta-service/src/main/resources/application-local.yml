spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
        jdbc:
          enabled: false
  datasource:
    url: ${ROUTING_DB_URL:jdbc:postgresql://localhost:5432/routing}
    username: ${ROUTING_DB_USER:postgres}
    password: ${ROUTING_DB_PASSWORD:devpass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

routing:
  jwt:
    issuer: ${ROUTING_JWT_ISSUER:instacommerce-identity}
    public-key: ${ROUTING_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}
  ws:
    allowed-origins: ${ROUTING_WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:local-dev-disabled}

internal:
  service:
    name: ${spring.application.name}
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.0}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
