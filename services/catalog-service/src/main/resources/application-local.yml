spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:postgres}
    password: ${CATALOG_DB_PASSWORD:devpass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

catalog:
  jwt:
    public-key: ${CATALOG_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
