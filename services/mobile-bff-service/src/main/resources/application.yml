server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mobile-bff-service
  http:
    converters:
      preferred-json-mapper: jackson2
  config:
    import: optional:sm://
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cache:
    type: caffeine

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.monitoring:4318/v1/traces}
    metrics:
      endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector.monitoring:4318/v1/metrics}
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

internal:
  service:
    name: ${spring.application.name}
    token: ${INTERNAL_SERVICE_TOKEN:}

mobile-bff:
  jwt:
    issuer: ${MOBILE_BFF_JWT_ISSUER:instacommerce-identity}
    public-key: ${sm://jwt-rsa-public-key:${MOBILE_BFF_JWT_PUBLIC_KEY:}}
  upstream:
    catalog-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
    search-url: ${SEARCH_SERVICE_URL:http://search-service:8088}
    feature-flag-url: ${FEATURE_FLAG_SERVICE_URL:http://config-feature-flag-service:8098}
    cart-url: ${CART_SERVICE_URL:http://cart-service:8090}
    order-url: ${ORDER_SERVICE_URL:http://order-service:8084}
    identity-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
    wallet-url: ${WALLET_LOYALTY_SERVICE_URL:http://wallet-loyalty-service:8095}
    pricing-url: ${PRICING_SERVICE_URL:http://pricing-service:8089}
    inventory-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}
    fulfillment-url: ${FULFILLMENT_SERVICE_URL:http://fulfillment-service:8086}
    routing-eta-url: ${ROUTING_ETA_SERVICE_URL:http://routing-eta-service:8094}
    checkout-url: ${CHECKOUT_ORCHESTRATOR_SERVICE_URL:http://checkout-orchestrator-service:8091}
    timeout-ms: ${UPSTREAM_TIMEOUT_MS:2000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      catalogService:
        baseConfig: default
      searchService:
        baseConfig: default
      featureFlagService:
        baseConfig: default
      identityService:
        baseConfig: default
      walletLoyaltyService:
        baseConfig: default
      pricingService:
        baseConfig: default
      inventoryService:
        baseConfig: default
      cartService:
        baseConfig: default
      orderService:
        baseConfig: default
      fulfillmentService:
        baseConfig: default
      routingEtaService:
        baseConfig: default
      checkoutService:
        baseConfig: default
