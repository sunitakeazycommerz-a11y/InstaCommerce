server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mobile-bff-service
  config:
    import: optional:sm://
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cache:
    type: caffeine

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.monitoring:4318/v1/traces}
    metrics:
      endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector.monitoring:4318/v1/metrics}
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

internal:
  service:
    name: ${spring.application.name}
    token: ${INTERNAL_SERVICE_TOKEN:}

mobile-bff:
  jwt:
    issuer: ${MOBILE_BFF_JWT_ISSUER:instacommerce-identity}
    public-key: ${sm://jwt-rsa-public-key:${MOBILE_BFF_JWT_PUBLIC_KEY:}}
  upstream:
    catalog-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
    search-url: ${SEARCH_SERVICE_URL:http://search-service:8086}
    feature-flag-url: ${FEATURE_FLAG_SERVICE_URL:http://config-feature-flag-service:8096}
    timeout-ms: ${UPSTREAM_TIMEOUT_MS:2000}
