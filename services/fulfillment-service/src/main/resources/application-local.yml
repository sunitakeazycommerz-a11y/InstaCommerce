spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
        jdbc:
          enabled: false
  datasource:
    url: ${FULFILLMENT_DB_URL:jdbc:postgresql://localhost:5432/fulfillment}
    username: ${FULFILLMENT_DB_USER:postgres}
    password: ${FULFILLMENT_DB_PASSWORD:devpass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

fulfillment:
  jwt:
    issuer: ${FULFILLMENT_JWT_ISSUER:instacommerce-identity}
    public-key: ${FULFILLMENT_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}
  clients:
    order:
      base-url: ${ORDER_SERVICE_URL:http://localhost:8084}
    payment:
      base-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
    inventory:
      base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
    warehouse:
      base-url: ${WAREHOUSE_SERVICE_URL:http://localhost:8092}

internal:
  service:
    name: ${spring.application.name}
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.0}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
