server:
  port: 8096
  shutdown: graceful

spring:
  application:
    name: config-feature-flag-service
  config:
    import: "optional:classpath:application-test-noop.properties"
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost/feature_flags_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=30s
  redis:
    host: localhost
    port: 6379
    timeout: 2s

feature-flag:
  jwt:
    issuer: instacommerce-identity
    public-key: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA
  cache:
    ttl-seconds: 30
    max-entries: 5000
    refresh-interval-seconds: 30
