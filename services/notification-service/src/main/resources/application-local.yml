spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
        jdbc:
          enabled: false
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USER:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:devpass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

notification:
  jwt:
    issuer: ${NOTIFICATION_JWT_ISSUER:instacommerce-identity}
    public-key: ${NOTIFICATION_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}
  providers:
    sendgrid:
      api-key: ${SENDGRID_API_KEY:SG.local_placeholder}
      from-email: ${SENDGRID_FROM_EMAIL:no-reply@localhost.instacommerce.dev}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:local_twilio_placeholder}
      auth-token: ${TWILIO_AUTH_TOKEN:local_twilio_placeholder}
      from-number: ${TWILIO_FROM_NUMBER:+15005550006}
    fcm:
      project-id: ${FCM_PROJECT_ID:local-dev}
      access-token: ${FCM_ACCESS_TOKEN:local_fcm_placeholder}
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8084}

internal:
  service:
    name: ${spring.application.name}
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.0}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
