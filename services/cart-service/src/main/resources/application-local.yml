spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
        jdbc:
          enabled: false
  datasource:
    password: ${CART_DB_PASSWORD:devpass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

cart:
  jwt:
    public-key: ${CART_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}

pricing-service:
  base-url: ${PRICING_SERVICE_URL:http://localhost:8089}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.0}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
