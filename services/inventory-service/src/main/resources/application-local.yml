spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
        jdbc:
          enabled: false
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${INVENTORY_DB_USER:postgres}
    password: ${INVENTORY_DB_PASSWORD:devpass}

inventory:
  jwt:
    issuer: ${INVENTORY_JWT_ISSUER:instacommerce-identity}
    public-key: ${INVENTORY_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}

internal:
  service:
    name: ${spring.application.name}
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.0}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
