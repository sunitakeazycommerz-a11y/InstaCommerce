spring:
  cloud:
    gcp:
      secretmanager:
        enabled: false
      sql:
        enabled: false
        jdbc:
          enabled: false
  datasource:
    password: ${IDENTITY_DB_PASSWORD:devpass}

identity:
  jwt:
    public-key: ${IDENTITY_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}
    private-key: ${IDENTITY_JWT_PRIVATE_KEY:}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

management:
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
