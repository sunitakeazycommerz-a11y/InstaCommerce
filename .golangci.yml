run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true

linters-settings:
  govet:
    enable-all: false
    enable:
      - nilness
  errcheck:
    check-type-assertions: true
    check-blank: false
    exclude-functions:
      - (*net/http.Response).Body.Close
      - (*net/http.Request).Body.Close
      - (io.Closer).Close
      - (*encoding/json.Encoder).Encode
      - (*os.File).Close
      - net/http.ResponseWriter.Write
  staticcheck:
    checks: ["all", "-SA1019"]
  unused:
    local-variables-are-used: false
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104 # duplicates errcheck

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
