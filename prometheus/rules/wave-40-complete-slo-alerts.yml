        labels:
          severity: critical
          service: identity-service
          slo_window: fast_burn
          tier: tier-3
        annotations:
          summary: "Identity Service CRITICAL: Error rate >10% (SEV-1)"
          description: "Auth failures: {{ $value | humanizePercentage }}. Cascading impact: All services affected."
          pagerduty_severity: "critical"

      - alert: JwtValidationLatency
        expr: |
          histogram_quantile(0.99, sum(rate(jwt_validation_duration_seconds_bucket[5m])) by (le))
          > 0.1
        for: 5m
        labels:
          severity: warning
          service: identity-service
          slo_metric: latency
        annotations:
          summary: "JWT validation p99 >100ms SLO breach"
          description: "p99: {{ $value | humanizeDuration }} (target: 100ms)"

      - alert: FeatureFlagServiceFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="config-feature-flag-service", status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total{service="config-feature-flag-service"}[5m])) by (service)
          ) > 0.1
        for: 1m
        labels:
          severity: warning
          service: config-feature-flag-service
          slo_window: fast_burn
          tier: tier-3
        annotations:
          summary: "Feature Flag Service WARNING: Error rate >10%"

      - alert: FeatureFlagCacheMissRate
        expr: |
          (
            sum(rate(feature_flag_cache_misses_total[5m])) by (service)
            / (sum(rate(feature_flag_cache_hits_total[5m])) by (service) + sum(rate(feature_flag_cache_misses_total[5m])) by (service))
          ) > 0.05
        for: 10m
        labels:
          severity: info
          service: config-feature-flag-service
          slo_metric: cache_hit_rate
        annotations:
          summary: "Feature Flag cache miss rate >5% (target: >95% hits)"

      - alert: ReconciliationEngineJobFailure
        expr: reconciliation_job_failures_total > 0
        for: 1m
        labels:
          severity: critical
          service: reconciliation-engine
          slo_window: fast_burn
          tier: tier-3
        annotations:
          summary: "Reconciliation Engine CRITICAL: Job failed (SEV-1)"
          description: "Financial impact: Reconciliation run failed. Requires immediate investigation."
          pagerduty_severity: "critical"

      - alert: ReconciliationMismatchesDetected
        expr: reconciliation_mismatches_count > 0
        for: 5m
        labels:
          severity: critical
          service: reconciliation-engine
          slo_metric: accuracy
        annotations:
          summary: "Reconciliation Engine CRITICAL: Mismatches detected"
          description: "{{ $value }} mismatches require audit review. Compliance risk."

      - alert: AuditTrailServiceFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="audit-trail-service", status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total{service="audit-trail-service"}[5m])) by (service)
          ) > 0.1
        for: 1m
        labels:
          severity: warning
          service: audit-trail-service
          slo_window: fast_burn
          tier: tier-3
        annotations:
          summary: "Audit Trail Service WARNING: Error rate >10%"

      - alert: CDCConsumerLag
        expr: |
          sum(kafka_consumer_lag{consumer_group="cdc-consumer-group"}) > 50000
        for: 5m
        labels:
          severity: warning
          service: cdc-consumer-service
          slo_metric: lag
          tier: tier-3
        annotations:
          summary: "CDC Consumer lag >50K (SLO: <10K)"
          description: "Consumer lag: {{ $value }} messages"

      - alert: StreamProcessorSlowBurn
        expr: |
          (
            sum(rate(http_requests_total{service="stream-processor-service", status=~"5.."}[6h])) by (service)
            / sum(rate(http_requests_total{service="stream-processor-service"}[6h])) by (service)
