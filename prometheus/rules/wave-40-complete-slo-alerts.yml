# Wave 40 Phase 3: Complete SLO Alert Rules - InstaCommerce Platform
# 50+ multi-window burn-rate alert rules for all 28 services
# Reference: https://sre.google/workbook/alerting-on-slos/
# Implementation: 3-tier alerting (SEV-1 fast/SEV-2 medium/SEV-3 slow) + error budget tracking
# Generated: 2026-03-22 (Wave 40 Phase 3)

groups:
  # ============================================
  # TIER 1: CRITICAL MONEY PATH ALERTS
  # Payment, Checkout, Order, Fulfillment
  # ============================================
  - name: tier_1_critical_path
    interval: 30s
    rules:
      # Payment Service: 99.95% SLO (2.2 min/month budget)
      - alert: PaymentServiceFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="payment-service", status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total{service="payment-service"}[5m])) by (service)
          ) > 0.1
        for: 1m
        labels:
          severity: critical
          service: payment-service
          slo_window: fast_burn
          tier: tier-1
        annotations:
          summary: "Payment Service CRITICAL: Error rate >10% in 5min (SLO breach - SEV-1)"
          description: "{{ $labels.service }} has error rate {{ $value | humanizePercentage }} (threshold 10%). Monthly error budget: 2.2 min. Expected status: {{ .GroupLabels.severity }}"
          runbook_url: "https://docs.instacommerce.dev/docs/runbooks/payment-service-errors"
          dashboard_url: "https://grafana.instacommerce.dev/d/slo-payment-service"
          pagerduty_severity: "critical"
          on_call_action: "Page immediately - SEV-1 incident"

      - alert: PaymentServiceMediumBurn
        expr: |
          (
            sum(rate(http_requests_total{service="payment-service", status=~"5.."}[30m])) by (service)
            / sum(rate(http_requests_total{service="payment-service"}[30m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: payment-service
          slo_window: medium_burn
          tier: tier-1
        annotations:
          summary: "Payment Service WARNING: Error rate >5% in 30min (SLO breach - SEV-2)"
          description: "{{ $labels.service }} sustained error rate {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.instacommerce.dev/docs/runbooks/payment-service-errors"

      - alert: PaymentServiceSlowBurn
        expr: |
          (
            sum(rate(http_requests_total{service="payment-service", status=~"5.."}[6h])) by (service)
            / sum(rate(http_requests_total{service="payment-service"}[6h])) by (service)
          ) > 0.01
        for: 30m
        labels:
          severity: info
          service: payment-service
          slo_window: slow_burn
          tier: tier-1
        annotations:
          summary: "Payment Service INFO: Error rate >1% in 6h (SLO review - SEV-3)"
          description: "{{ $labels.service }} error rate {{ $value | humanizePercentage }} requires SRE review"
          runbook_url: "https://docs.instacommerce.dev/docs/runbooks/payment-service-audit"

      - alert: PaymentServiceLatencySLOBreach
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="payment-service"}[5m])) by (le))
          > 0.3
        for: 5m
        labels:
          severity: critical
          service: payment-service
          slo_metric: latency
          tier: tier-1
        annotations:
          summary: "Payment Service p99 latency >300ms SLO breach"
          description: "p99 latency: {{ $value | humanizeDuration }} (target: 300ms)"
          pagerduty_severity: "critical"

      - alert: PaymentWebhookDeliveryFailure
        expr: |
          (
            sum(rate(payment_webhook_delivery_failed_total[5m])) by (service)
            / sum(rate(payment_webhook_sent_total[5m])) by (service)
          ) > 0.01
        for: 1m
        labels:
          severity: critical
          service: payment-webhook-service
          slo_window: fast_burn
          tier: tier-1
        annotations:
          summary: "Payment Webhook CRITICAL: >1% delivery failure rate"
          description: "Webhook delivery failure rate {{ $value | humanizePercentage }}. Risk: Lost payment confirmations."
          pagerduty_severity: "critical"

      # Order Service: 99.9% SLO (8.6 min/month budget)
      - alert: OrderServiceFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="order-service", status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total{service="order-service"}[5m])) by (service)
          ) > 0.1
        for: 1m
        labels:
          severity: critical
          service: order-service
          slo_window: fast_burn
          tier: tier-1
        annotations:
          summary: "Order Service CRITICAL: Error rate >10% in 5min (SEV-1)"
          description: "{{ $labels.service }} error rate {{ $value | humanizePercentage }}. Budget: 8.6 min/month"
          pagerduty_severity: "critical"

      - alert: OrderServiceMediumBurn
        expr: |
          (
            sum(rate(http_requests_total{service="order-service", status=~"5.."}[30m])) by (service)
            / sum(rate(http_requests_total{service="order-service"}[30m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: order-service
          slo_window: medium_burn
          tier: tier-1
        annotations:
          summary: "Order Service WARNING: Error rate >5% in 30min (SEV-2)"

      - alert: OrderServiceSlowBurn
        expr: |
          (
            sum(rate(http_requests_total{service="order-service", status=~"5.."}[6h])) by (service)
            / sum(rate(http_requests_total{service="order-service"}[6h])) by (service)
          ) > 0.01
        for: 30m
        labels:
          severity: info
          service: order-service
          slo_window: slow_burn

      # Checkout Orchestrator: 99.9% SLO
      - alert: CheckoutOrchestrationFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="checkout-orchestrator-service", status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total{service="checkout-orchestrator-service"}[5m])) by (service)
          ) > 0.1
        for: 1m
        labels:
          severity: critical
          service: checkout-orchestrator-service
          slo_window: fast_burn
          tier: tier-1
        annotations:
          summary: "Checkout Orchestrator CRITICAL: Error rate >10% (SEV-1)"
          description: "Checkout failures: {{ $value | humanizePercentage }}. Revenue impact possible."
          pagerduty_severity: "critical"

      - alert: CheckoutLatencySLOBreach
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="checkout-orchestrator-service"}[5m])) by (le))
          > 2.0
        for: 5m
        labels:
          severity: warning
          service: checkout-orchestrator-service
          slo_metric: latency
          tier: tier-1
        annotations:
          summary: "Checkout p99 latency >2s SLO breach"
          description: "p99: {{ $value | humanizeDuration }} (target: 2s). Impacts user experience."

      # Fulfillment Service: 99.5% SLO
      - alert: FulfillmentServiceFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="fulfillment-service", status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total{service="fulfillment-service"}[5m])) by (service)
          ) > 0.1
        for: 1m
        labels:
          severity: critical
          service: fulfillment-service
          slo_window: fast_burn
          tier: tier-1
        annotations:
          summary: "Fulfillment Service CRITICAL: Error rate >10% (SEV-1)"
          description: "Rider assignment failures: {{ $value | humanizePercentage }}"

      - alert: FulfillmentETAAccuracyDegraded
        expr: |
          (100 - histogram_quantile(0.95, rate(eta_accuracy_percent_bucket[15m]))) > 15
        for: 10m
        labels:
          severity: warning
          service: fulfillment-service
          slo_metric: eta_accuracy
          tier: tier-1
        annotations:
          summary: "Fulfillment ETA accuracy <80% (>20min deviation)"
          description: "ETA accuracy {{ $value }}% below 95% target. Impacts customer satisfaction."

