  # ============================================
  # ERROR BUDGET ALERTS (All Services)
  # ============================================
  - name: error_budget_tracking
    interval: 5m
    rules:
      - alert: ErrorBudgetConsumption75Percent
        expr: |
          (
            1 - (
              sum(increase(http_requests_total{status!~"5.."}[30d])) by (service)
              / sum(increase(http_requests_total[30d])) by (service)
            )
          ) / (1 - on(service) group_left slo_target{slo_target > 0}) > 0.75
        for: 1h
        labels:
          severity: warning
          alert_type: error_budget
        annotations:
          summary: "Error budget >75% consumed for {{ $labels.service }}"
          description: "{{ $labels.service }} has consumed {{ $value | humanizePercentage }} of monthly budget. Recommend feature freeze."

      - alert: ErrorBudgetExhausted
        expr: |
          (
            1 - (
              sum(increase(http_requests_total{status!~"5.."}[30d])) by (service)
              / sum(increase(http_requests_total[30d])) by (service)
            )
          ) / (1 - on(service) group_left slo_target{slo_target > 0}) >= 1.0
        for: 10m
        labels:
          severity: critical
          alert_type: error_budget
        annotations:
          summary: "CRITICAL: Error budget EXHAUSTED for {{ $labels.service }}"
          description: "{{ $labels.service }} has exceeded monthly error budget. Feature freeze in effect."
          pagerduty_severity: "critical"

  # ============================================
  # INFRASTRUCTURE & SYSTEM HEALTH
  # ============================================
  - name: infrastructure_alerts
    interval: 30s
    rules:
      - alert: KubernetesNodeNotReady
        expr: |
          count(kube_node_status_condition{condition="Ready", status="true"})
          < count(kube_node_status_condition{condition="Ready"})
        for: 5m
        labels:
          severity: critical
          component: kubernetes
        annotations:
          summary: "Kubernetes node not ready"
          description: "{{ $value }} nodes are not in Ready state"

      - alert: HighMemoryUsage
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "High memory usage: {{ $labels.container }}"
          description: "Memory usage: {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: |
          rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota > 0.9
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "High CPU usage: {{ $labels.container }}"

      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[1h]) > 3
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod crash looping: {{ $labels.pod }}"
          description: "{{ $value }} restarts in past hour"

      - alert: DatabaseConnectionPoolNearExhaustion
        expr: |
          hikaricp_connections_active / hikaricp_connections_max > 0.85
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "DB connection pool near exhaustion"
          description: "Active connections: {{ $value | humanizePercentage }} of max"

      - alert: KafkaBrokerDown
        expr: |
          count(up{job="kafka-broker"} == 1) < 3
        for: 2m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka broker down"
          description: "Only {{ $value }} brokers up (need minimum 3)"

      - alert: RedisMemoryUsageHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage high"
          description: "Memory usage: {{ $value | humanizePercentage }}"

  # ============================================
  # CROSS-SERVICE DEPENDENCY ALERTS
  # ============================================
  - name: cross_service_dependencies
    interval: 1m
    rules:
      - alert: DownstreamServiceDegraded
        expr: |
          (
            sum(rate(upstream_calls_total{status=~"5.."}[5m])) by (upstream_service)
            / sum(rate(upstream_calls_total[5m])) by (upstream_service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          alert_type: dependency
        annotations:
          summary: "Upstream service degradation for {{ $labels.upstream_service }}"
          description: "Error rate to {{ $labels.upstream_service }}: {{ $value | humanizePercentage }}"

      - alert: ServiceToServiceLatencyHigh
        expr: |
          histogram_quantile(0.99, sum(rate(upstream_call_duration_seconds_bucket[5m])) by (upstream_service, le))
          > 5.0
        for: 5m
        labels:
          severity: warning
          alert_type: dependency
        annotations:
          summary: "Service-to-service latency high for {{ $labels.upstream_service }}"
          description: "p99 latency: {{ $value | humanizeDuration }}"

# Alert routing configuration
# Maps alerts to PagerDuty escalation policies
alert_routing:
  tier-1-critical:
    policy: "critical-path-oncall"
    escalation: "5 min -> SRE lead -> Platform VP"
    critical_window: "00:00-23:59 UTC"

  tier-1-warning:
    policy: "payment-team-oncall"
    escalation: "15 min -> Team lead -> Payment manager"

  tier-2-warning:
    policy: "platform-oncall"
    escalation: "30 min -> Platform lead"

  tier-3-warning:
    policy: "sre-team"
    escalation: "1 hour -> SRE lead"

  infrastructure-critical:
    policy: "infra-oncall"
    escalation: "5 min -> Infra lead -> VP Engineering"

# Maintenance windows
maintenance_windows:
  deployment:
    days: "Tuesday, Thursday"
    time: "10:00-11:00 UTC"
    silence_alerts: true

  maintenance:
    days: "Sunday"
    time: "02:00-04:00 UTC"
    silence_non_critical: true
