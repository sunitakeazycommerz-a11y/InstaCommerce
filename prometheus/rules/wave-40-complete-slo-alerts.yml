  # ============================================
  # TIER 3: PLATFORM SERVICES
  # Identity, Config, Audit, CDC, Stream, Reconciliation
  # ============================================
  - name: tier_3_platform_services
    interval: 30s
    rules:
      - alert: IdentityServiceFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="identity-service", status=~"5.."}[5m])) by (service)
