# SLO Recording & Alert Rules - InstaCommerce Platform
groups:
  - name: instacommerce-slo-rules
    interval: 30s
    rules:
      - record: slo:availability_target:ratio
        labels:
          service: order-service
          slo: "99.5"
        expr: "0.995"

      - record: sli:http_availability:rate5m
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) by (service)
          )

      - record: sli:http_availability:rate30m
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[30m])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[30m])) by (service)
          )

      - record: sli:http_availability:rate1h
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[1h])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1h])) by (service)
          )

      - record: sli:http_availability:rate6h
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[6h])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[6h])) by (service)
          )

      - record: sli:http_latency_p99:rate5m
        expr: |
          histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])) by (le, service))

      - alert: OrderServiceBurnRate_Critical
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{service="order-service",status=~"5..",uri!~"/actuator.*"}[5m])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{service="order-service",uri!~"/actuator.*"}[5m])) by (service)
          ) > (14.4 * (1 - 0.995))
          and
          (
            sum(rate(http_server_requests_seconds_count{service="order-service",status=~"5..",uri!~"/actuator.*"}[1h])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{service="order-service",uri!~"/actuator.*"}[1h])) by (service)
          ) > (14.4 * (1 - 0.995))
        for: 2m
        labels:
          severity: page
          service: order-service
          tier: "1"
          slo: "99.5"
        annotations:
          summary: "order-service burning 99.5% SLO error budget at 14.4x rate"
