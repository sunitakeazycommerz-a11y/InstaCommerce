# SLO Alert Rules - InstaCommerce Platform
# Canonical SLI/SLO recording rules live in monitoring/prometheus-rules.yaml.
groups:
  - name: instacommerce-slo-rules
    interval: 30s
    rules:
      - alert: OrderServiceBurnRate_Critical
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{service="order-service",status=~"5..",uri!~"/actuator.*"}[5m])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{service="order-service",uri!~"/actuator.*"}[5m])) by (service)
          ) > (14.4 * (1 - 0.995))
          and
          (
            sum(rate(http_server_requests_seconds_count{service="order-service",status=~"5..",uri!~"/actuator.*"}[1h])) by (service)
            /
            sum(rate(http_server_requests_seconds_count{service="order-service",uri!~"/actuator.*"}[1h])) by (service)
          ) > (14.4 * (1 - 0.995))
        for: 2m
        labels:
          severity: page
          service: order-service
          tier: "1"
          slo: "99.5"
        annotations:
          summary: "order-service burning 99.5% SLO error budget at 14.4x rate"
